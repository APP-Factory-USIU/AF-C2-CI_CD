name: Continuous Integration (CI)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

# Cancel in-progress runs for the same branch if a new commit is pushed.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Code Quality & Type Checking
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript checks
        run: npm run lint

  test:
    name: Unit & Integration Tests
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run test suite
        env:
          NODE_ENV: test
          PORT: 3000
          API_KEY: ${{ secrets.API_KEY || 'ci_verified_pipeline_test_secret_key' }}
        run: npm test

  build:
    name: Docker Image Build & Smoke Test
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker build \
            --tag devops-course-api:latest \
            --tag devops-course-api:${{ github.sha }} \
            .

      - name: Smoke test the container
        run: |
          set -euo pipefail
          container_name="devops-course-api-ci"
          cleanup() {
            docker logs "$container_name" || true
            docker rm --force "$container_name" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run --detach \
            --name "$container_name" \
            --publish 3000:3000 \
            --env API_KEY=ci_smoke_test_secret \
            devops-course-api:latest

          for attempt in {1..20}; do
            if curl --fail --silent http://localhost:3000/health >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 20 ]; then
              echo "Container did not become healthy in time."
              exit 1
            fi
            sleep 2
          done

          curl --fail --silent http://localhost:3000/ >/dev/null
          curl --fail --silent \
            --header "x-api-key: ci_smoke_test_secret" \
            "http://localhost:3000/calculate?a=12&b=4&op=multiply"
